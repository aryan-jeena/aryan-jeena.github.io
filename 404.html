<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · route not found — aryan.os</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #67E8F9; --primary: #38BDF8; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Inter', sans-serif;
      color: #C7D2E0;
      background:
        radial-gradient(1100px 600px at 75% 12%, rgba(56,189,248,0.14), transparent 60%),
        linear-gradient(135deg, #0b1220 0%, #111c34 45%, #0c2a4d 100%);
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
      overflow: hidden;
    }
    .wrap { width: min(680px, 100%); }
    .term {
      background: rgba(2, 6, 23, 0.55);
      border: 1px solid rgba(103, 232, 249, 0.18);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      overflow: hidden;
    }
    .term-bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .term-bar span { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    .d1 { background: #FF5F57; } .d2 { background: #FEBC2E; } .d3 { background: #28C840; }
    .term-bar small { margin-left: auto; color: #7e93ad; letter-spacing: .12em; text-transform: uppercase; font-size: 11px; }
    .term-body { padding: 26px 22px 30px; font-size: 15px; line-height: 1.9; }
    .mono { font-family: 'Space Grotesk', ui-monospace, Menlo, monospace; }
    .prompt { color: #8FA3BC; }
    .cmd { color: #C7D2E0; }
    .err { color: #ff6b6b; }
    .big {
      font-family: 'Space Grotesk', sans-serif; font-weight: 700;
      font-size: clamp(3.5rem, 14vw, 7rem); line-height: 1; margin: 6px 0 4px;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(103,232,249,0.18);
    }
    .sub { color: #9fb2cc; margin: 0 0 22px; }
    .home {
      display: inline-flex; align-items: center; gap: .55rem;
      font-weight: 600; text-decoration: none; color: #fff;
      padding: .7rem 1.3rem; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      box-shadow: 0 8px 24px rgba(56,189,248,0.35);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .home:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(56,189,248,0.5); }
    .cursor { display: inline-block; width: 9px; height: 1.05em; background: var(--accent); vertical-align: -2px; margin-left: 3px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="term">
      <div class="term-bar"><span class="d1"></span><span class="d2"></span><span class="d3"></span><small>aryan.os · /dev/visitor</small></div>
      <div class="term-body">
        <div class="mono"><span class="prompt">aryan@os ~$</span> <span class="cmd">cd</span> <span class="cmd" id="path">this-page</span></div>
        <div class="mono err">bash: route not found: no such file or directory</div>
        <div class="big mono">404</div>
        <p class="sub">That path doesn't exist — but the rest of the system is fully operational.</p>
        <a class="home mono" href="/"><i></i>↩ cd&nbsp;~&nbsp;&nbsp;(back home)</a>
        <div class="mono" style="margin-top:18px; color:#6b7e97;"><span class="prompt">aryan@os ~$</span> <span class="cursor"></span></div>
      </div>
    </div>
  </div>
  <script>
    try { document.getElementById('path').textContent = location.pathname.replace(/^\//,'') || 'this-page'; } catch (e) {}
  </script>
</body>
</html>
